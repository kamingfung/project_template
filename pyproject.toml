[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "project_template"
version = "0.1.0"
description = "Modern Kedro + MLflow + uv project template"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "humanize>=4.0.0,<5.0",
  "kedro[jupyter]>=1.0,<2.0",
  "kedro-datasets[pandas]>=9.0,<10.0",
  "kedro-mlflow>=2.0,<3.0",
  "mlflow>=3.0,<4.0",
  "pandas>=2.2,<4.0",
  "pyarrow>=19.0,<25.0",
]

[project.scripts]
"project-template" = "project_template.__main__:main"

[project.entry-points."kedro.hooks"]

[dependency-groups]
dev = [
  "ipython>=8.10",
  "jupyter>=1.1.1",
  "kedro-viz>=12.0",
  "pre-commit>=4.2.0",
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "pytest-mock>=3.14",
  "pytest-sugar>=1.0",
  "pytest-xdist>=3.6",
  "ruff>=0.12.0",
  "ty>=0.0.1a1",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.kedro]
package_name = "project_template"
project_name = "project_template"
kedro_init_version = "1.0.0"
tools = "['Linting', 'Testing', 'Custom Logging', 'Data Structure', 'Kedro Viz']"
example_pipeline = "True"
source_dir = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = """
-ra \
-n auto \
--import-mode=importlib \
"""

[tool.coverage.run]
omit = [
  "src/**/pipeline*.py",
  "src/**/__init__.py",
  "src/**/__main__.py",
  "src/**/settings.py",
  "src/**/hooks.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]

[tool.ruff]
line-length = 88
show-fixes = true
extend-include = ["*.ipynb"]
lint.select = [
  "F",    # Pyflakes
  "W",    # pycodestyle warnings
  "E",    # pycodestyle errors
  "I",    # isort
  "UP",   # pyupgrade
  "PL",   # Pylint
  "T201", # Print statement
]
lint.ignore = [
  "E501",    # line too long
  "PLR0913", # too many arguments
  "PLR0917", # too many positional arguments
  "PLR2004", # magic value comparison
  "PLR0912", # too many branches
  "PLR0915", # too many statements
  "PLW0108", # unnecessary lambda
]

[tool.ruff.format]
docstring-code-format = true
preview = false

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "F821", "T201"]
"tests/**/*.py" = ["E402", "PLC0415"]
".claude/**/*.py" = ["T201"]
"src/**/profile_hook.py" = ["T201"]

[tool.kedro_telemetry]
project_id = "c9c39854391541eb964fec532e1f7b4d"
